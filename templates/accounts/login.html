{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Login to CTF Platform</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-success w-100" type="submit">Login</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Need an account? <a href="{% url 'register' %}">Register Now</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
