{% extends 'base.html' %}
{% block content %}
<div class="row mb-4">
    <div class="col text-center">
        <h2>Live Leaderboard</h2>
        <p class="text-muted">Rankings update dynamically without refreshing</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow rounded mb-5">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" class="text-center" style="width: 10%">Rank</th>
                            <th scope="col" style="width: 60%">Team Name</th>
                            <th scope="col" class="text-center" style="width: 30%">Score</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- AJAX will populate this -->
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">Loading Leaderboard...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function updateLeaderboard() {
        fetch("{% url 'leaderboard_data' %}")
        .then(response => response.json())
        .then(data => {
            let tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            if (data.leaderboard.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4">No active teams yet</td></tr>';
                return;
            }

            let rank = 1;
            data.leaderboard.forEach(team => {
                let tr = document.createElement('tr');
                if(rank === 1) tr.classList.add('table-success'); // Highlight 1st place!
                
                tr.innerHTML = `
                    <td class="text-center fw-bold">#${rank}</td>
                    <td class="fw-bold">${team.name}</td>
                    <td class="text-center"><span class="badge bg-primary rounded-pill fs-6">${team.score}</span></td>
                `;
                tbody.appendChild(tr);
                rank++;
            });
        });
    }

    // Initial load
    updateLeaderboard();

    // Poll every 5 seconds (micro-caching implementation against Thundering Herd problem)
    setInterval(updateLeaderboard, 5000);
</script>
{% endblock %}
